name: python-semantic-release

# python-semantic-release takes everything but these inputs from the caller's
# [tool.semantic_release] table: where the version is written, the build
# command, and the release commit's message. This workflow adds one default to
# that table, mask_initial_release, which the caller's own setting overrides.

on:
  workflow_call:
    inputs:
      runs-on:
        description: >-
          The runner, as JSON: '"ubuntu-latest"', or '["self-hosted","<label>"]'
          for a pool.
        type: string
        default: '"ubuntu-latest"'
      directory:
        description: The directory holding pyproject.toml, from the repository root.
        type: string
        default: .
      noop:
        description: >-
          Work out the release and write nothing: no commit, no tag, no GitHub
          release. The outputs still carry what would have been cut.
        type: boolean
        default: false
    outputs:
      released:
        description: >-
          "true" when a version was cut. Also "true" on a re-run that created
          the GitHub release for the tag a failed attempt pushed.
        value: ${{ jobs.release.outputs.released }}
      version:
        description: The version cut, with no leading v.
        value: ${{ jobs.release.outputs.version }}
      tag:
        description: The tag cut. A publish job checks it out rather than the branch.
        value: ${{ jobs.release.outputs.tag }}

jobs:
  release:
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    permissions:
      contents: write
    outputs:
      released: ${{ steps.finish.outputs.released || steps.release.outputs.released }}
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The next step reads TOML, which Python's standard library does from
      # 3.11. A self-hosted runner may carry no Python at all, and uv fetches
      # one where the runner has none recent enough. Nothing is installed into
      # the environment, so there is nothing to cache.
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: 0.12.18
          enable-cache: false

      # A first release's notes list every commit since the repository began,
      # with its body, and GitHub refuses a release body over 125,000
      # characters. With mask_initial_release on, a first release's notes read
      # "Initial Release" instead. python-semantic-release loads one config
      # file, so this writes the caller's whole table with that default added,
      # and the action loads it with -c. Every path in the table still resolves
      # from the directory the action runs in.
      - name: Default a first release's notes to one line
        id: config
        env:
          PYPROJECT: ${{ inputs.directory }}/pyproject.toml
          CONFIG: ${{ runner.temp }}/semantic-release.json
        run: |
          uv run --no-project --python '>=3.11' python - <<'EOF'
          import json, os, tomllib

          with open(os.environ["PYPROJECT"], "rb") as f:
              table = tomllib.load(f).get("tool", {}).get("semantic_release", {})
          templates = table.setdefault("changelog", {}).setdefault("default_templates", {})
          templates.setdefault("mask_initial_release", True)
          with open(os.environ["CONFIG"], "w") as f:
              json.dump({"semantic_release": table}, f)
          EOF

      # The action's container sees the runner's temp directory at
      # /github/runner_temp, which is where the step above wrote the config.
      - uses: python-semantic-release/python-semantic-release@21ed7fa03e4a17ac49406eff4b60d5ad050fbdc2 # v9.21.2
        id: release
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          directory: ${{ inputs.directory }}
          root_options: >-
            -v -c /github/runner_temp/semantic-release.json
            ${{ inputs.noop && '--noop' || '' }}
          # The GitHub release body is the changelog, built from the same
          # commits, so no CHANGELOG.md is written or tracked.
          changelog: "false"

      # python-semantic-release pushes the tag, then creates the release. When
      # the second fails, a re-run checks out this run's commit again, and the
      # tag sits on it or on the version commit after it. The re-run computes
      # the same version, finds its tag, and releases nothing. So a tag at or
      # after this run's commit with no release is that earlier attempt's, and
      # this step creates its release. An older release's tag sits behind this
      # commit, and is left alone.
      #
      # GitHub writes these notes, not python-semantic-release, so notes that
      # GitHub refused once cannot be refused again.
      - name: Create the release a failed attempt left without one
        id: finish
        if: ${{ !inputs.noop && steps.release.outputs.released == 'false' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
          PRERELEASE: ${{ steps.release.outputs.is_prerelease }}
        run: |
          [ -n "$TAG" ] || exit 0
          git rev-parse --quiet --verify "refs/tags/${TAG}" >/dev/null || exit 0
          git merge-base --is-ancestor "$GITHUB_SHA" "refs/tags/${TAG}" || exit 0

          releases="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/releases"
          status=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer ${GH_TOKEN}" "${releases}/tags/${TAG}")
          case "$status" in
            200) exit 0 ;;
            404) ;;
            *)
              echo "::error::looking up the release for ${TAG} returned HTTP ${status}"
              exit 1
              ;;
          esac

          jq -n --arg tag "$TAG" --argjson prerelease "${PRERELEASE:-false}" \
            '{tag_name: $tag, name: $tag, prerelease: $prerelease, generate_release_notes: true}' |
            curl -fsS -o /dev/null -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'Accept: application/vnd.github+json' --data @- "$releases"
          echo "::notice::created the release for ${TAG}, which an earlier attempt pushed"
          echo "released=true" >>"$GITHUB_OUTPUT"
